version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  senderapi:
    build:
      context: ./SenderService
    ports:
      - "5001:80"
    depends_on:
      - rabbitmq
    environment:
    - ASPNETCORE_ENVIRONMENT=Development

  receiverapi:
    build:
      context: ./RecieverService
    depends_on:
      - rabbitmq
    deploy:
      replicas: 3